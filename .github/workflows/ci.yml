# Проверка сайта при каждом PR и каждом изменении main:
# типы, линтер, форматирование, сборка и автотесты в Chromium и WebKit (движок Safari).
name: Проверка

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Типы, линтер, форматирование
        run: npm run check

      - name: Сборка
        run: npm run build

      - name: Браузеры для тестов
        run: npx playwright install --with-deps chromium webkit

      - name: Автотесты
        run: npm test

      - name: Отчёт тестов
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
